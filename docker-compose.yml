services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: safetrust
      POSTGRES_USER: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safetrust"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  hasura:
    image: hasura/graphql-engine:v2.36.0
    ports:
      - "8080:8080"
    restart: always
    environment:
      ## postgres database to store Hasura metadata
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/safetrust
      ## this env var can be used to add the above postgres database to Hasura as a data source. this can be removed/updated based on your needs
      PG_DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/safetrust
      ## enable the console served by server
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true" # set to "false" to disable console
      ## enable debugging mode. It is recommended to disable this in production
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      ## uncomment next line to run console offline (i.e load console assets from server instead of CDN)
      # HASURA_GRAPHQL_CONSOLE_ASSETS_DIR: /srv/console-assets
      ## uncomment next line to set an admin secret
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?HASURA_GRAPHQL_ADMIN_SECRET is required — copy .env.example to .env and set a value}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    # Every variable validated by apps/backend/src/config/env.ts is passed
    # through here. Required ones use `:?` so `docker-compose up` fails fast
    # with a clear message instead of the container crash-looping on boot.
    # Optional ones default to empty, which the backend treats as unset.
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      # Postgres / Hasura (in-network service names, not localhost)
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/safetrust
      HASURA_GRAPHQL_URL: http://hasura:8080/v1/graphql
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?HASURA_GRAPHQL_ADMIN_SECRET is required — copy .env.example to .env and set a value}
      # Firebase Admin SDK — required by the env schema; auth-protected routes
      # 401 every request without a real service-account key.
      FIREBASE_ADMIN_PROJECT_ID: ${FIREBASE_ADMIN_PROJECT_ID:?FIREBASE_ADMIN_PROJECT_ID is required — see .env.example}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${FIREBASE_ADMIN_CLIENT_EMAIL:?FIREBASE_ADMIN_CLIENT_EMAIL is required — see .env.example}
      FIREBASE_ADMIN_PRIVATE_KEY: ${FIREBASE_ADMIN_PRIVATE_KEY:?FIREBASE_ADMIN_PRIVATE_KEY is required — see .env.example}
      # Trustless Work / Stellar — optional; refunds, dispute resolution and
      # escrow-status webhooks return 503/401 until these are set.
      TRUSTLESS_WORK_API_URL: ${TRUSTLESS_WORK_API_URL:-https://dev.api.trustlesswork.com}
      TRUSTLESS_WORK_API_KEY: ${TRUSTLESS_WORK_API_KEY:-}
      TRUSTLESS_WORK_DISPUTE_RESOLVER_SECRET: ${TRUSTLESS_WORK_DISPUTE_RESOLVER_SECRET:-}
      TRUSTLESS_WORK_WEBHOOK_SECRET: ${TRUSTLESS_WORK_WEBHOOK_SECRET:-}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      # Observability — optional
      SENTRY_DSN: ${SENTRY_DSN:-}
      CRITICAL_ALERT_WEBHOOK_URL: ${CRITICAL_ALERT_WEBHOOK_URL:-}
      # Notifications — optional
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-noreply@truestub.local}
    depends_on:
      postgres:
        condition: service_healthy
      hasura:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "4000:4000"

volumes:
  db_data:
