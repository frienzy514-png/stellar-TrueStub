name: Backend CI

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: safetrust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d safetrust"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Apply database migrations
        run: yarn workspace @truestub/backend migrate:up --check-order
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/safetrust

      - name: Typecheck backend
        run: yarn workspace @truestub/backend typecheck

      - name: Build backend
        run: yarn workspace @truestub/backend build

      - name: Test backend
        run: yarn workspace @truestub/backend test
