name: Backend CI

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck backend
        run: yarn workspace @truestub/backend typecheck

      - name: Build backend
        run: yarn workspace @truestub/backend build

      - name: Test backend
        run: yarn workspace @truestub/backend test
