name: Frontend CI

on:
  pull_request:
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".github/workflows/frontend-ci.yml"
      - "docs/GRAPHQL_WIRING_STATUS.md"
      - "scripts/check-wiring-status-paths.mjs"

permissions:
  contents: read

jobs:
  # Fails if docs/GRAPHQL_WIRING_STATUS.md points at a file that doesn't
  # exist (closes #366). No install needed, so it runs in a few seconds.
  wiring-status-paths:
    name: Check GRAPHQL_WIRING_STATUS.md paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify every referenced path exists
        run: node scripts/check-wiring-status-paths.mjs

  frontend:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint wiring TODOs
        run: |
          set -euo pipefail

          MARKER='// TODO: Replace with actual API call'
          ISSUE_RE='#[0-9]+|issue'

          # Determine the base ref to diff against. For pull_request events,
          # compare against the merge base with the target branch.
          BASE_REF=""
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}" || true
            BASE_REF="origin/${GITHUB_BASE_REF}"
          fi

          if [ -n "$BASE_REF" ] && git rev-parse --verify --quiet "$BASE_REF" >/dev/null; then
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_REF"...HEAD -- 'apps/frontend/**/*.ts' 'apps/frontend/**/*.tsx' 'apps/frontend/**/*.js' 'apps/frontend/**/*.jsx' || true)
          else
            # Fallback: scan all tracked frontend source files.
            CHANGED_FILES=$(git ls-files 'apps/frontend/**/*.ts' 'apps/frontend/**/*.tsx' 'apps/frontend/**/*.js' 'apps/frontend/**/*.jsx' || true)
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed frontend source files to check for wiring TODOs."
            exit 0
          fi

          FAILED=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ -f "$file" ] || continue

            # Find line numbers containing the exact marker.
            MATCH_LINES=$(grep -nF -- "$MARKER" "$file" | cut -d: -f1 || true)
            [ -z "$MATCH_LINES" ] && continue

            while IFS= read -r lineno; do
              [ -z "$lineno" ] && continue

              # Check the same line and the immediately following line for an issue reference.
              SAME_LINE=$(sed -n "${lineno}p" "$file")
              NEXT_LINE=$(sed -n "$((lineno + 1))p" "$file")

              if echo "$SAME_LINE" | grep -Eq "$ISSUE_RE" || echo "$NEXT_LINE" | grep -Eq "$ISSUE_RE"; then
                continue
              fi

              echo "::warning file=${file},line=${lineno}::Wiring TODO without a linked issue reference. Add an issue number (e.g. #123) or the word 'issue' on the same or next line."
              FAILED=1
            done <<< "$MATCH_LINES"
          done <<< "$CHANGED_FILES"

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more wiring TODOs lack a linked issue reference."
            exit 1
          fi

          echo "All wiring TODOs reference an issue."

      - name: Lint frontend
        run: yarn workspace @truestub/frontend lint

      - name: Typecheck frontend
        run: yarn workspace @truestub/frontend typecheck

      - name: Test frontend
        run: yarn workspace @truestub/frontend test:ci

      - name: Build frontend
        run: yarn workspace @truestub/frontend build

      - name: Bundle size budget
        run: |
          set -euo pipefail

          # Budget in kilobytes for the built frontend output.
          BUDGET_KB=5000
          # Allow a small tolerance (in KB) before failing.
          TOLERANCE_KB=50

          DIST_DIR="apps/frontend/.next"
          if [ ! -d "$DIST_DIR" ]; then
            DIST_DIR="apps/frontend/dist"
          fi

          if [ ! -d "$DIST_DIR" ]; then
            echo "::warning::Could not find a built output directory (.next or dist); skipping bundle size check."
            exit 0
          fi

          # Measure the size of the built output in kilobytes.
          SIZE_KB=$(du -sk "$DIST_DIR" | cut -f1)
          LIMIT_KB=$((BUDGET_KB + TOLERANCE_KB))

          echo "Bundle size: ${SIZE_KB} KB (budget: ${BUDGET_KB} KB, tolerance: ${TOLERANCE_KB} KB)"

          if [ "$SIZE_KB" -gt "$LIMIT_KB" ]; then
            echo "::warning::Bundle size ${SIZE_KB} KB exceeds budget of ${BUDGET_KB} KB (limit ${LIMIT_KB} KB including tolerance)."
            echo "Bundle size regression detected: ${SIZE_KB} KB > ${LIMIT_KB} KB limit."
            exit 1
          fi

          echo "Bundle size within budget."

  # ─────────────────────────────────────────────────────────────────────────
  # Firebase rules gate (closes #393)
  #
  # Runs `firebase-rules.test.ts` whenever `firestore.rules` or
  # `storage.rules` is modified.  This is a REQUIRED check: a PR that
  # weakens a security rule and breaks the test suite will be blocked from
  # merging.
  #
  # The job uses `paths-filter` to detect rule-file changes, then runs the
  # full firebase-rules test suite.  It is separate from the main `frontend`
  # job so it can be required as a distinct status check in branch protection.
  # ─────────────────────────────────────────────────────────────────────────
  firebase-rules:
    name: Firebase security rules tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed rules files
        id: rules-changed
        run: |
          # Determine whether firestore.rules or storage.rules changed in this PR.
          BASE_REF=""
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}" || true
            BASE_REF="origin/${GITHUB_BASE_REF}"
          fi

          CHANGED=false
          if [ -n "$BASE_REF" ] && git rev-parse --verify --quiet "$BASE_REF" >/dev/null; then
            if git diff --name-only "$BASE_REF"...HEAD | grep -qE '^apps/frontend/(firestore|storage)\.rules$'; then
              CHANGED=true
            fi
          else
            # Fallback (push to branch with no base): always run.
            CHANGED=true
          fi

          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "Rules files changed: ${CHANGED}"

      - name: Setup Node.js
        if: steps.rules-changed.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        if: steps.rules-changed.outputs.changed == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.rules-changed.outputs.changed == 'true'
        run: yarn install --immutable

      - name: Run Firebase rules tests
        if: steps.rules-changed.outputs.changed == 'true'
        # firebase-rules.test.ts uses @firebase/rules-unit-testing which
        # requires the Firebase Emulator Suite.  The emulator JAR is bundled
        # with the `firebase-tools` CLI; we start the emulators automatically
        # via `FIREBASE_EMULATOR_HUB` and let the test environment connect.
        run: |
          npx --yes firebase-tools@latest emulators:exec \
            --project demo-truestub-rules \
            --only firestore,storage \
            "yarn workspace @truestub/frontend test:ci --testPathPattern='firebase-rules'"
        working-directory: apps/frontend
        env:
          # The project ID must match the one used in initializeTestEnvironment.
          FIREBASE_PROJECT: demo-truestub-rules
          # Suppress the interactive "install emulators?" prompt.
          CI: "true"

      - name: Skip message (no rules files changed)
        if: steps.rules-changed.outputs.changed != 'true'
        run: echo "No firestore.rules / storage.rules changes detected — skipping Firebase rules tests."

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is optional — only needed for org-level scanning features.
          # Public repos and personal forks work without it.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}