name: Backend Uptime

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            "${{ secrets.BACKEND_HEALTH_URL }}" \
            || (echo "Backend health check failed" && exit 1)

  reconcile-escrow-status:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile Hasura escrow status against Trustless Work
        run: |
          curl --fail --silent --show-error \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RECONCILIATION_JOB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.BACKEND_BASE_URL }}/internal/reconcile/escrow-status" \
            || (echo "Escrow status reconciliation failed" && exit 1)
