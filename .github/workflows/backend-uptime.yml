name: Backend Uptime

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Verify BACKEND_HEALTH_URL hostname resolves
        run: |
          HEALTH_URL="${{ vars.BACKEND_HEALTH_URL }}"
          if [ -z "$HEALTH_URL" ]; then
            echo "BACKEND_HEALTH_URL is not configured; skipping DNS check"
            exit 0
          fi
          HOST=$(echo "$HEALTH_URL" | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' | sed -E 's#^[^/]*@##' | sed -E 's#^\[([^]]*)\].*#\1#' | sed -E 's#^([^/:?]+).*#\1#')
          if [ -z "$HOST" ]; then
            echo "BACKEND_HEALTH_URL appears stale or misconfigured: could not extract hostname from '$HEALTH_URL'"
            exit 1
          fi
          if ! getent hosts "$HOST" > /dev/null 2>&1; then
            echo "BACKEND_HEALTH_URL appears stale or misconfigured: $HOST did not resolve"
            exit 1
          fi
          echo "BACKEND_HEALTH_URL hostname resolved: $HOST"

      - name: Check backend dependency health
        env:
          HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::BACKEND_HEALTH_URL secret is not configured"
            exit 1
          fi

          set +e
          RESPONSE=$(curl --silent --show-error --max-time 30 --write-out '\n%{http_code}' "${HEALTH_URL%/}/health/deep")
          CURL_STATUS=$?
          set -e

          if [ "$CURL_STATUS" -ne 0 ]; then
            echo "::error::Backend process is down or unreachable"
            exit 1
          fi

          HTTP_STATUS=$(printf '%s\n' "$RESPONSE" | tail -n 1)
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')
          HEALTH_STATUS=$(printf '%s' "$BODY" | jq -r '.status // "invalid"' 2>/dev/null)

          case "$HEALTH_STATUS" in
            healthy)
              echo "Backend process and dependencies are healthy"
              ;;
            degraded)
              echo "::warning::Backend process is alive but a dependency is degraded (HTTP $HTTP_STATUS)"
              printf '%s' "$BODY" | jq -c '{status, dependencies}'
              ;;
            down)
              echo "::error::Backend health reports all dependencies down (HTTP $HTTP_STATUS)"
              printf '%s' "$BODY" | jq -c '{status, dependencies}'
              exit 1
              ;;
            *)
              echo "::error::Backend returned an invalid deep-health response (HTTP $HTTP_STATUS)"
              exit 1
              ;;
          esac

  reconcile-escrow-status:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile Hasura escrow status against Trustless Work
        run: |
          curl --fail --silent --show-error \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RECONCILIATION_JOB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.BACKEND_BASE_URL }}/internal/reconcile/escrow-status" \
            || (echo "Escrow status reconciliation failed" && exit 1)
