name: In-Memory Store Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write  # needed to post the advisory PR comment

jobs:
  in-memory-store-check:
    name: Flag newly added in-memory stores in backend services
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan added lines for new in-memory stores
        id: scan
        # Advisory only: the script always exits 0; the comment below is the signal.
        run: node scripts/check-in-memory-stores.mjs --base origin/${{ github.base_ref }}
        env:
          GITHUB_OUTPUT: ${{ github.output }}

      - name: Post or update advisory PR comment
        if: steps.scan.outputs.finding_count != '0'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.scan.outputs.report }}
        with:
          script: |
            const marker = '<!-- in-memory-store-check -->';
            const body = process.env.REPORT;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
