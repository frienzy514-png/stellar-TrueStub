<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ticket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ticket Body with Notches -->
  <path d="M 24 16 
           A 12 12 0 0 1 36 4 
           L 92 4 
           A 12 12 0 0 1 104 16 
           L 104 68 
           A 10 10 0 0 0 104 88 
           L 104 112 
           A 12 12 0 0 1 92 124 
           L 36 124 
           A 12 12 0 0 1 24 112 
           L 24 88 
           A 10 10 0 0 0 24 68 
           Z" 
        fill="url(#ticket-grad)" 
        filter="url(#glow)"/>

  <!-- Perforation line -->
  <line x1="32" y1="78" x2="96" y2="78" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 3" stroke-opacity="0.6"/>

  <!-- Verified Shield -->
  <path d="M 64 24 
           L 82 32 
           C 82 52 74 62 64 66 
           C 54 62 46 52 46 32 
           Z" 
        fill="#ffffff" 
        opacity="0.95"/>

  <!-- Shield Checkmark -->
  <path d="M 54 44 L 61 51 L 74 37" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Star Sparkle -->
  <path d="M 86 20 Q 86 26 92 26 Q 86 26 86 32 Q 86 26 80 26 Q 86 26 86 20 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 40 54 Q 40 58 44 58 Q 40 58 40 62 Q 40 58 36 58 Q 40 58 40 54 Z" fill="#ffffff" opacity="0.8"/>

  <!-- Stub Barcode -->
  <rect x="36" y="90" width="3" height="20" rx="1.5" fill="#ffffff" opacity="0.85"/>
  <rect x="42" y="90" width="6" height="20" rx="1.5" fill="#ffffff" opacity="0.85"/>
  <rect x="51" y="90" width="2" height="20" rx="1" fill="#ffffff" opacity="0.85"/>
  <rect x="56" y="90" width="7" height="20" rx="1.5" fill="#ffffff" opacity="0.85"/>
  <rect x="66" y="90" width="4" height="20" rx="1.5" fill="#ffffff" opacity="0.85"/>
  <rect x="73" y="90" width="8" height="20" rx="1.5" fill="#ffffff" opacity="0.85"/>
  <rect x="84" y="90" width="3" height="20" rx="1.5" fill="#ffffff" opacity="0.85"/>
  <rect x="90" y="90" width="2" height="20" rx="1" fill="#ffffff" opacity="0.85"/>
</svg>
